name: Sync Upstream

on:
  # 每天 UTC 20:00 (北京时间早晨 04:00) 自动检查并同步作者的更新
  schedule:
    - cron: '0 20 * * *'
  # 允许在 Actions 页面手动点击运行测试
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Sync Upstream
        run: |
          # 1. 设置 git 机器人身份
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # 2. 添加 ones20250 的原仓库地址
          git remote add upstream https://github.com/ones20250/Openwrt-AX6600.git

          # 3. 获取上游最新代码并合并
          git fetch upstream
          git checkout main

          if git merge upstream/main; then
            echo "成功合并作者 ones20250 的更新，准备推送到你的仓库..."
            git push origin main
          else
            echo "没有新更新或存在冲突"
          fi
