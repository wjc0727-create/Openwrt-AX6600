name: Sync Upstream

on:
  schedule:
    - cron: '0 20 * * *' # 每天 UTC 20:00 (北京时间早晨 04:00) 自动检查
  workflow_dispatch:     # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Sync Upstream
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git remote add upstream https://github.com/ones20250/Openwrt-AX6600.git
          git fetch upstream

          # 检查落后上游多少个提交
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "落后上游提交数: $BEHIND"

          if [ "$BEHIND" -gt 0 ]; then
            echo "发现上游有新更新，正在同步..."
            git checkout main
            git merge upstream/main
            git push origin main
            echo "同步完成，已推送至你的仓库！"
          else
            echo "当前已经是最新代码，无需同步。"
          fi
