#CI项目
name: QCA-ALL

#CI计划
on:
  # 自动编译：当仓库主分支有代码更新（包括同步上游）时触发
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.github/workflows/Sync-Upstream.yml'

  #自动编译：当Auto-Clean运行完成后
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed

  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

#CI权限
permissions: write-all

#CI任务
jobs:
  config:
    name: ${{matrix.CONFIG}}
    strategy:
      fail-fast: false
      #max-parallel: 3
      matrix:
        CONFIG: [IPQ60XX-WIFI-YES]
        PROFILE: [PURE, PLUS]
        SOURCE: [ones20250/immortalwrt_ipq]
        BRANCH: [main]

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题
      #WRT_THEME: aurora
      WRT_THEME: bootstrap
      #默认主机名
      WRT_NAME: 6_8_ydn
      #默认WIFI名称
      WRT_SSID: OWRT
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.6.8
      #默认密码，仅作提示，修改无用
      WRT_PW: Watson0727-rt
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      WRT_PACKAGE: |
        ${{inputs.PACKAGE}}
        CONFIG_PACKAGE_luci-ssl=y
        CONFIG_PACKAGE_kmod-ip6tables=y
        CONFIG_PACKAGE_kmod-ipt-core=y
        CONFIG_PACKAGE_kmod-ipt-extra=y
        CONFIG_PACKAGE_kmod-ipt-nat=y
        CONFIG_PACKAGE_kmod-ipt-nat6=y
        CONFIG_PACKAGE_kmod-ipt-physdev=y
        CONFIG_PACKAGE_kmod-nf-ipvs=y
        CONFIG_PACKAGE_kmod-ipt-fullconenat=y
        CONFIG_PACKAGE_kmod-ipt-conntrack=y
        CONFIG_PACKAGE_luci-app-keepalived=y
        CONFIG_PACKAGE_kmod-ipt-ipset=y
        CONFIG_PACKAGE_ipset=y
        CONFIG_PACKAGE_luci-app-cloudflared=y
        CONFIG_PACKAGE_luci-app-dockerman=y
        CONFIG_PACKAGE_luci-app-watchcat=y
        CONFIG_PACKAGE_luci-app-nlbwmon=y
        CONFIG_PACKAGE_luci-app-mwan3=y
      #固件版本：PURE=纯净版，PLUS=Plus 版
      WRT_PROFILE: ${{matrix.PROFILE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST}}
